name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_blog
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Django checks
        env:
          DJANGO_SECRET_KEY: ci-secret
          DJANGO_DEBUG: "False"
          DB_NAME: ai_blog
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
          LLM_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ci-placeholder
          ANTHROPIC_MODEL: claude-sonnet-4-6
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run
          python manage.py check
      - name: Django tests
        env:
          DJANGO_SECRET_KEY: ci-secret
          DJANGO_DEBUG: "False"
          DB_NAME: ai_blog
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
          LLM_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ci-placeholder
          ANTHROPIC_MODEL: claude-sonnet-4-6
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          python manage.py test --noinput

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend deps
        run: |
          cd frontend
          npm ci
      - name: Lint
        run: |
          cd frontend
          npm run lint
      - name: Build
        run: |
          cd frontend
          npm run build
