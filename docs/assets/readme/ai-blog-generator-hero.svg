<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">AI Blog Generator</title>
  <desc id="description">Generate, share, and improve content through a provider-neutral full-stack AI workflow.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <circle cx="1025" cy="60" r="155" fill="#38bdf8" opacity="0.14" filter="url(#glow)"/>
  <circle cx="160" cy="340" r="170" fill="#a78bfa" opacity="0.16" filter="url(#glow)"/>
  <path d="M0 294 C210 220 390 360 620 286 S980 222 1200 272 V360 H0Z" fill="#ffffff" opacity="0.04"/>

  <g transform="translate(92 72)">
    <rect width="92" height="92" rx="22" fill="url(#accent)"/>
    <rect x="24" y="19" width="42" height="54" rx="6" fill="#ffffff"/>
    <rect x="32" y="31" width="25" height="4" rx="2" fill="#6366f1"/>
    <rect x="32" y="41" width="29" height="4" rx="2" fill="#6366f1"/>
    <rect x="32" y="51" width="20" height="4" rx="2" fill="#6366f1"/>
    <path d="M61 27l18 18-8 2-14-14zM57 34l9 2-22 31-11 4 4-11z" fill="#ffffff"/>
  </g>

  <text x="214" y="116" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="750">AI Blog Generator</text>
  <text x="214" y="159" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">A full-stack content workflow that turns ideas into measurable reader feedback.</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="650">
    <g transform="translate(214 210)">
      <rect width="190" height="54" rx="27" fill="#ffffff" opacity="0.11" stroke="#c4b5fd" stroke-opacity="0.55"/>
      <circle cx="28" cy="27" r="8" fill="#a78bfa"/>
      <text x="48" y="33" fill="#ffffff">Topic + persona</text>
    </g>
    <path d="M424 237h38" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
    <path d="M454 230l9 7-9 7" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(482 210)">
      <rect width="210" height="54" rx="27" fill="#ffffff" opacity="0.11" stroke="#7dd3fc" stroke-opacity="0.55"/>
      <circle cx="28" cy="27" r="8" fill="#38bdf8"/>
      <text x="48" y="33" fill="#ffffff">Flexible AI engine</text>
    </g>
    <path d="M712 237h38" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
    <path d="M742 230l9 7-9 7" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(770 210)">
      <rect width="165" height="54" rx="27" fill="#ffffff" opacity="0.11" stroke="#7dd3fc" stroke-opacity="0.55"/>
      <circle cx="28" cy="27" r="8" fill="#34d399"/>
