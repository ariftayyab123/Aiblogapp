    </g>
    <path d="M955 237h38" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
    <path d="M985 230l9 7-9 7" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(1013 210)">
      <rect width="126" height="54" rx="27" fill="#ffffff" opacity="0.11" stroke="#7dd3fc" stroke-opacity="0.55"/>
      <circle cx="27" cy="27" r="8" fill="#fbbf24"/>
